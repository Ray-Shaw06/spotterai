<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">SpotterAI shield and barbell</title>

  <!-- Light/forest identity. The dark build used a near-black tile with a violet
       mark and a radial glow; a solid brand tile with a paper mark holds up far
       better at 32px, where a gradient just turns to mud. -->
