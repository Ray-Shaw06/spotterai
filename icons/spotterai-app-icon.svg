    <path d="M12 18h8M12 16v4M20 16v4M10.3 16.7v2.6M21.7 16.7v2.6" stroke-width="1.7" />
    <path d="M13.6 12.4c.1-2.5 2.1-4.4 4.7-4.4 0 2.6-1.9 4.5-4.4 4.6M14.2 11.9l3-2.7" stroke-width="1.5" />
