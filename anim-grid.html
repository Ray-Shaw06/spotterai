<!doctype html>
<!-- DEV TOOL: renders every exercise's animation in one grid for visual QA.
     Not linked from the app. ?f=start|end freezes poses; ?only=name,name filters. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>anim grid</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { background: #0b0714; padding: 0; margin: 0; }
  body::before, body::after { display: none; }
  .grid { display: grid; grid-template-columns: repeat(6, 168px); gap: 6px; padding: 10px; }
  .cell { background: #150e26; border: 1px solid #3a2f5a; border-radius: 8px; padding: 2px; }
  .cell h4 { font: 700 10px/1.15 monospace; color: #d8cffa; text-align: center; margin: 3px 2px; }
  .ex-anim { margin: 0; padding: 2px; border: 0; background: none; }
  .ex-anim__svg { width: 128px; height: 160px; }
  .ex-anim__cap { display: none; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script type="module">
  import { EXERCISE_DATA } from "./exercise-data.js";
  import { patternAnimation } from "./exercise-anim.js";
  const g = document.getElementById("g");
  const params = new URLSearchParams(location.search);
  const only = (params.get("only") || "").toLowerCase().split(",").filter(Boolean);
  const list = only.length ? EXERCISE_DATA.filter((e) => only.some((o) => e.name.toLowerCase().includes(o))) : EXERCISE_DATA;
  if (only.length) {
    const st = document.createElement("style");
    st.textContent = ".ex-anim__svg { width: 256px; height: 320px; } .grid { grid-template-columns: repeat(4, 300px); }";
    document.head.appendChild(st);
  }
  g.innerHTML = list.map((e) =>
    `<div class="cell"><h4>${e.name}</h4>${patternAnimation(e.movementPattern, e.primaryMuscles, e)}</div>`
  ).join("");
  const f = params.get("f");
  if (f === "end") {
    const st = document.createElement("style");
    st.textContent = ".ex-anim__svg, .ex-anim__svg * { animation-iteration-count: 1 !important; animation-direction: normal !important; animation-fill-mode: forwards !important; animation-delay: -9s !important; }";
    document.head.appendChild(st);
  } else if (f === "start") {
    const st = document.createElement("style");
    st.textContent = ".ex-anim__svg, .ex-anim__svg * { animation-play-state: paused !important; animation-delay: 0s !important; }";
    document.head.appendChild(st);
  }
  document.title = "ready:" + g.querySelectorAll(".ex-anim").length;
</script>
</body>
</html>
