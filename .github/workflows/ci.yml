name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # There is no build step and no type checker, so nothing else in this repo
    # stands between a typo in a browser module and a ReferenceError on a
    # user's phone. `no-undef` is that backstop. The config is tuned to report
    # only what is worth fixing — see the reasoning in eslint.config.js.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Unlike the test job below, linting does need its tool installed.
      # `npm ci` installs from the lockfile, so the version that gates CI is
      # exactly the version a contributor gets locally.
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero dependencies — nothing to install. Node's built-in test runner only.
      # Coverage comes from node's own --experimental-test-coverage, so this
      # stays true: no nyc, no c8, nothing added to run the suite.
      - name: Run tests
        run: npm run test:coverage
      # Coverage is a report, not a gate. fail_ci_if_error stays false so a
      # Codecov outage — or a run before CODECOV_TOKEN is set at all — cannot
      # turn a passing suite red. The test step above is what gates the build.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  evaluator:
    name: Evaluator benchmark
    runs-on: ubuntu-latest
    # The safety evaluator is the product's whole claim, and until now the only
    # job that ran it was Benchmark history, which is push-to-main only. That
    # made the benchmark a post-merge report rather than a gate: a PR could
    # regress a safety check, go green here, and only be noticed after landing.
    # It needs no key and no network, so there is no reason it was not a gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the evaluator benchmark
        run: npm run eval

  readme:
    name: README claims
    runs-on: ubuntu-latest
    # The README's headline numbers are the first thing a reader checks, and
    # they had drifted (717/21/one vs. the real 855/23/two). This job derives
    # each figure from the repo and fails if the prose disagrees, so the
    # numbers can never quietly go stale again. No install needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check README claims against the repo
        run: npm run check:readme
